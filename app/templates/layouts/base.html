<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if app_description %}<meta name="description" content="{{ app_description }}">{% endif %}
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/pico.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
  </head>
  <body>
    <header class="container site-header">
      <strong>{{ app_name }}</strong>
      {% if current_user %}
      <div class="site-session">
        <span class="site-session-email">{{ current_user.email }}</span>
        <form method="post" action="/logout"><button type="submit" class="secondary outline">Log out</button></form>
      </div>
      {% endif %}
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <footer class="container release">
      <small>
        {{ app_name }} <span class="release-version">v{{ app_version }}</span>
        · build <code title="{{ commit_sha }}">{{ commit_short }}</code>
      </small>
    </footer>
  </body>
</html>
