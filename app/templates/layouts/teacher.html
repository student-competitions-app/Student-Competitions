{% extends "layouts/base.html" %}

{% block content %}
<nav class="area-tabs" aria-label="Teacher area">

    {% for tab in teacher_tabs %}
    <li><a href="{{ tab.path }}"{% if tab.key == active_tab %} aria-current="page"{% endif %}>{{ tab.label }}</a></li>
    {% endfor %}
  </ul>
</nav>
{% block teacher_content %}{% endblock %}
{% endblock %}
