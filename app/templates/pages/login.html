{% extends "layouts/base.html" %}

{% block title %}Sign in — {{ app_name }}{% endblock %}

{% block content %}
<section class="auth">
  <h1>Sign in</h1>
  {% if message %}
  <p class="auth-message" role="alert">{{ message }}</p>
  {% else %}
  <p>Enter your email address and we will send you a sign-in code.</p>
  {% endif %}
  <form method="post" action="/login">
    <label for="email">Email address</label>
    <input type="email" id="email" name="email" required autocomplete="email" value="{{ email }}">
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Send code</button>
  </form>
</section>
{% endblock %}
