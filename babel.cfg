# Message extraction for `scripts/translations.sh update` and `tests/unit/test_catalogues.py`
# (specs/012.5-ukrainian-localisation research R5). The component gallery's content stays English
# and is never extracted (FR-027); the ignores come first so they win over the patterns below.
[ignore: app/templates/pages/admin/components.html]
[ignore: app/routers/admin_components.py]

[python: app/**.py]

[jinja2: app/templates/**.html]
extensions = jinja2.ext.i18n
silent = false
