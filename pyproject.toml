[project]
name = "student-competitions"
version = "0.1.0"
description = "A web application for running online knowledge competitions among students."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "sqlmodel>=0.0.47",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
    "ruff",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
