# Render Blueprint: the hosting side of the milestone, as code.
# Contract: specs/002-public-deploy-cicd/contracts/render-service.md — rationale: research D1–D3.
#
# `region` is immutable after creation: changing it means a new service and a new public address.
# Seven secrets are declared below by key only (`sync: false`): the production database URL
# (milestone 3 FR-032), the four sign-in secrets (milestone 4:
# specs/004-email-otp-auth/contracts/configuration.md) and the teacher and student lists
# (milestone 5: specs/005-roles-authorization/contracts/configuration.md). Their values are
# entered once in the Render dashboard and are never committed. Without any of the first five the
# service refuses to start; the two lists may be left empty.
# The database itself is on Neon, not Render, so there is no `databases:` block here
# (specs/003-database-questions/research.md#d1).
services:
  - type: web
    name: student-competitions
    runtime: docker
    plan: free
    # The only branch Render will ever build. Combined with auto-deploy being off, a push to any
    # other branch can publish nothing (FR-022).
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Traffic is switched to a new instance only once this returns 2xx, and 60s of consecutive
    # failures restarts the instance (FR-006, FR-023).
    healthCheckPath: /healthz
    region: frankfurt
    # Custom domain, bought on NIC.UA; its DNS records (A @ → 216.24.57.1, CNAME www → the
    # onrender.com hostname) are managed there, not here.
    # Render adds www.brainring.org.ua automatically and redirects it to the root domain. The
    # onrender.com address keeps working until `renderSubdomainPolicy: disabled` is set.
    domains:
      - brainring.org.ua
    # Quoted deliberately: YAML 1.1 parses a bare `off` as the boolean false. The pipeline
    # (.github/workflows/deploy.yml) is the only thing that deploys this service (FR-020, FR-021).
    autoDeployTrigger: "off"
    envVars:
      # PORT is supplied by Render and RENDER_GIT_COMMIT is set automatically; HOST is stated
      # explicitly so the bind address is visible rather than implied.
      - key: HOST
        value: 0.0.0.0
      # Neon's direct (non-pooled) connection string, entered once in Render → service →
      # Environment (specs/003-database-questions/quickstart.md, step N2). `sync: false` declares
      # the key without a value. Without it the service refuses to start rather than fall back to
      # a throw-away SQLite file inside the container.
      - key: DATABASE_URL
        sync: false
      # Sign-in (milestone 4). On Render the application refuses to start unless login emails
      # really go out through Resend and every secret below is set; the error names each missing
      # setting and never shows a value (FR-041).
      - key: EMAIL_BACKEND
        value: resend
      # Signs session cookies and keys the stored code and rate-limit hashes; at least 32
      # characters. Rotating it signs everyone out.
      - key: SECRET_KEY
        sync: false
      # Comma-separated administrator addresses, reconciled on every start: removing one here
      # ends that person's access at the restart this change triggers.
      - key: ADMIN_EMAILS
        sync: false
      # Temporary until milestone 7: comma-separated teacher and student addresses, reconciled on
      # every start like ADMIN_EMAILS. May be left empty. Removing an address logs that person
      # out everywhere at the restart this change triggers.
      - key: TEACHER_EMAILS
        sync: false
      - key: STUDENT_EMAILS
        sync: false
      # A sending-only Resend key restricted to the verified domain.
      - key: RESEND_API_KEY
        sync: false
      # The sender on the verified domain, e.g. `Student Competitions <login@brainring.org.ua>`.
      - key: EMAIL_FROM
        sync: false
